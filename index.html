<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Model Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <label id="model-picker" hidden>Model
    <select id="model-select" aria-label="Select model"></select>
  </label>
  <!-- Main Viewer -->
  <model-viewer id="viewer"
    loading="eager"
    camera-controls
    interaction-prompt="none"
    tone-mapping="neutral"
    shadow-intensity="1"
    shadow-softness="0.7"
    exposure="0.9"
    alt="3D Model Viewer"
    environment-image="neutral"
    camera-orbit="45deg 55deg 105%"
    animation-crossfade-duration="0"
  ></model-viewer>

  <!-- Bed Controller Image Panel -->
  <div id="bed-controller-panel" hidden></div>
  <div id="animation-panel" aria-label="Animations" hidden></div>

  <div id="load-status" role="status" hidden>
    <p id="load-message"></p>
    <button id="retry-load" type="button">Retry</button>
  </div>

  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
